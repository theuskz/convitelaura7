<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Laura Botelho | XV</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Great+Vibes&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
    margin: 0;
    width: 100vw;
    height: 100vh;

    background-image: url('video/Clique aqui! (4).png');
    background-size: cover;      /* preenche a tela */
    background-position: center; /* centraliza */
    background-repeat: no-repeat;
    background-attachment: fixed;

    overflow: hidden;
    font-family: 'Poppins', sans-serif;
}

/* =========================
TELA INICIAL
========================= */

#startScreen{
position:fixed;
inset:0;
z-index:10000;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;
}




#openBtn{
position:relative;
z-index:20;
padding:18px 42px;
margin-top: 50px;
border: none;
border-radius:50px;
background:rgba(255,255,255,.1);


color:white;
font-size:20px;
letter-spacing:1px;

cursor:pointer;

box-shadow:
0 0 25px rgba(255,255,255,.25);

transition:.4s;
}

#openBtn:hover{
transform:scale(1.06);

background:rgba(255,255,255,.25);
}

/* =========================
VIDEO
========================= */

#intro{
position:fixed;
inset:0;

z-index:9999;

background:black;

display:none;
}

#intro video{
width:100%;
height:100%;
object-fit:cover;
}



.bg{

width:100vw;
height:100vh;

object-fit:fill;
}

/* OVERLAY */

.overlay{
position:absolute;

width:100%;
height:100%;
}

/* PARTÍCULAS */

.sparkle{
position:absolute;

width:4px;
height:4px;

background:#fff8d6;

border-radius:50%;

box-shadow:0 0 10px #fff6cc;

animation:sparkle 5s infinite;

opacity:.7;
}

.s1{top:10%;left:15%;}
.s2{top:30%;left:80%;}
.s3{top:55%;left:20%;}
.s4{top:72%;left:75%;}
.s5{top:88%;left:50%;}
.s6{top:40%;left:55%;}

@keyframes sparkle{

0%{
transform:scale(0);
opacity:0;
}

50%{
transform:scale(2);
opacity:1;
}

100%{
transform:scale(0);
opacity:0;
}

}

/* MENU */

.menu{
position:absolute;

bottom:50px;

width:100%;

display:flex;

justify-content:space-evenly;

z-index:20;
}

#voltarBtn {
    position: fixed;
    top: 20px;
    right: 20px;

    width: 58px;
    height: 58px;

    border: 1px solid rgba(255, 192, 203, .4);
    border-radius: 50%;

    background: rgba(255, 255, 255, .08);
    backdrop-filter: blur(6px);

    color: #fff;
    font-size: 28px;

    cursor: pointer;
    z-index: 99999;

    box-shadow:
        0 0 20px rgba(255, 192, 203, .25),
        inset 0 0 10px rgba(255, 255, 255, .05);

    transition: .3s ease;
}

#voltarBtn:hover {
    transform: scale(1.08);

    background: rgba(255, 192, 203, .15);

    box-shadow:
        0 0 30px rgba(255, 192, 203, .5),
        0 0 10px rgba(255, 255, 255, .2);
}

.btn{
width:95px;
height:95px;
border-radius:50%;
background:rgba(255,255,255,.15);
background-size:cover;
background-position:center;

display:flex;
align-items:center;
justify-content:center;

font-size:42px;

text-decoration:none;

color:white;

box-shadow:
0 0 25px rgba(255,192,203,.35);

transition:.4s;
}

.btn:hover{
transform:scale(1.08);
}

/* MOBILE */

@media(max-width:768px){

.btn{
width:82px;
height:82px;
font-size:35px;
}

}

</style>

</head>

<body>

<!-- =========================
TELA INICIAL
========================= -->
<button onclick="window.location.href='index.html'" id="voltarBtn">
    ✕
</button>


<section id="site">


<div class="overlay"></div>

<!-- PARTÍCULAS -->

<div class="sparkle s1"></div>
<div class="sparkle s2"></div>
<div class="sparkle s3"></div>
<div class="sparkle s4"></div>
<div class="sparkle s5"></div>
<div class="sparkle s6"></div>

</div>


</section>

<script>

const startScreen =
document.getElementById('startScreen');

const openBtn =
document.getElementById('openBtn');

const video =
document.getElementById('introVideo');

const intro =
document.getElementById('intro');

const site =
document.getElementById('site');

openBtn.onclick = () => {

startScreen.style.display = 'none';

intro.style.display = 'block';

video.play();

};

video.onended = () => {

intro.style.display = 'none';

site.style.display = 'block';

};

</script>

</body>
</html>
